name: Diagnose WLED 0.15.4 backport PR4529

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout WLED 0.15.4
        uses: actions/checkout@v6
        with:
          repository: wled/WLED
          ref: v0.15.4
          fetch-depth: 0

      - name: Fetch PR 4529 and reconstruct patch
        shell: bash
        run: |
          set -euxo pipefail

          git fetch --no-tags origin \
            refs/pull/4529/head:refs/remotes/origin/pr4529

          git fetch --no-tags origin \
            refs/pull/4529/merge:refs/remotes/origin/pr4529-merge

          MERGE_REF=refs/remotes/origin/pr4529-merge
          BASE="$(git rev-parse "$MERGE_REF^1")"

          echo "PR head:  $(git rev-parse refs/remotes/origin/pr4529)"
          echo "PR merge: $(git rev-parse "$MERGE_REF")"
          echo "PR base:  $BASE"

          git diff --binary "$BASE" "$MERGE_REF" > /tmp/wled-pr4529.diff
          test -s /tmp/wled-pr4529.diff

          echo "=== PR 4529 patch stat ==="
          git apply --stat /tmp/wled-pr4529.diff

      - name: Apply what can be applied and collect rejects
        shell: bash
        run: |
          set +e

          # --reject applies compatible hunks and writes only incompatible
          # hunks to *.rej files. We intentionally continue after failure.
          git apply --reject --whitespace=fix /tmp/wled-pr4529.diff
          APPLY_RC=$?

          echo "git apply return code: $APPLY_RC"

          mkdir -p /tmp/diag/rejects
          mkdir -p /tmp/diag/sources

          cp /tmp/wled-pr4529.diff /tmp/diag/WLED_PR4529_full.diff

          # Collect all reject files.
          find wled00 -type f -name '*.rej' -print | sort | while read f; do
            mkdir -p "/tmp/diag/rejects/$(dirname "$f")"
            cp "$f" "/tmp/diag/rejects/$f"
          done

          # Collect the affected v0.15.4 files AFTER non-conflicting hunks
          # have been applied, plus .orig where generated.
          for f in \
            wled00/FX_fcn.cpp \
            wled00/bus_manager.cpp \
            wled00/bus_manager.h \
            wled00/cfg.cpp \
            wled00/const.h \
            wled00/data/settings_leds.htm \
            wled00/set.cpp \
            wled00/wled.h \
            wled00/xml.cpp
          do
            if [ -f "$f" ]; then
              mkdir -p "/tmp/diag/sources/$(dirname "$f")"
              cp "$f" "/tmp/diag/sources/$f"
            fi
            if [ -f "$f.orig" ]; then
              mkdir -p "/tmp/diag/sources/$(dirname "$f")"
              cp "$f.orig" "/tmp/diag/sources/$f.orig"
            fi
          done

          {
            echo "=== STATUS ==="
            git status --short
            echo
            echo "=== REJECT FILES ==="
            find wled00 -type f -name '*.rej' -print | sort
            echo
            echo "=== REJECT CONTENTS ==="
            while read f; do
              [ -z "$f" ] && continue
              echo
              echo "######## $f ########"
              cat "$f"
            done < <(find wled00 -type f -name '*.rej' -print | sort)
          } | tee /tmp/diag/rejects.txt

          # Always succeed so the diagnostic artifact is uploaded.
          exit 0

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v7
        with:
          name: PR4529_v0154_backport_diagnostics
          path: /tmp/diag/**
          if-no-files-found: error
