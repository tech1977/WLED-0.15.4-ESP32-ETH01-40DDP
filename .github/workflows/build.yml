name: Build WLED 0.15.4 ESP32-ETH01 40 DDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WLED 0.15.4
        uses: actions/checkout@v4
        with:
          repository: wled/WLED
          ref: v0.15.4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch 40 DDP slots and WT32-ETH01 default
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("wled00/const.h")
          s = p.read_text(encoding="utf-8")
          old = "#define WLED_MIN_VIRTUAL_BUSSES 6"
          if old not in s:
              raise SystemExit("Expected WLED_MIN_VIRTUAL_BUSSES=6 not found")
          p.write_text(s.replace(old, "#define WLED_MIN_VIRTUAL_BUSSES 21", 1), encoding="utf-8")

          p = Path("wled00/wled.h")
          s = p.read_text(encoding="utf-8")
          old = "WLED_GLOBAL int ethernetType _INIT(WLED_ETH_NONE); // use none for ethernet board type if default not defined"
          new = "WLED_GLOBAL int ethernetType _INIT(WLED_ETH_WT32_ETH01); // custom build: default WT32-ETH01"
          if old not in s:
              raise SystemExit("Expected Ethernet default not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Install web UI dependencies
        run: npm ci

      - name: Build esp32_eth
        run: pio run -e esp32_eth

      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p dist
          cp .pio/build/esp32_eth/firmware.bin dist/WLED_0.15.4_ESP32-ETH01_40DDP.bin
          sha256sum dist/WLED_0.15.4_ESP32-ETH01_40DDP.bin > dist/WLED_0.15.4_ESP32-ETH01_40DDP.bin.sha256

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: WLED_0.15.4_ESP32-ETH01_40DDP
          path: dist/*
          if-no-files-found: error
