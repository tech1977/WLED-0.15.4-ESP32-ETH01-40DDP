name: Build WLED 0.15.4 test DDP Tech1977

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout WLED 0.15.4
        uses: actions/checkout@v6
        with:
          repository: wled/WLED
          ref: v0.15.4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Apply 40 DDP / 40 segment compatibility patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          # 1) Classic ESP32 UI capacity: 19 physical + 21 virtual = 40.
          p = "wled00/const.h"
          s = read(p)

          marker = "#define WLED_MAX_BUSSES 19"
          start = s.find(marker)
          if start < 0:
              raise SystemExit("Classic ESP32 WLED_MAX_BUSSES 19 block not found")

          target = "#define WLED_MIN_VIRTUAL_BUSSES 6"
          pos = s.find(target, start)
          if pos < 0 or (pos - start) > 900:
              raise SystemExit("Classic ESP32 WLED_MIN_VIRTUAL_BUSSES 6 not found")

          s = s[:pos] + "#define WLED_MIN_VIRTUAL_BUSSES 21" + s[pos + len(target):]
          write(p, s)

          # 2) 40 segments, keeping WLED's stock proportional effect-data formula.
          p = "wled00/FX.h"
          s = read(p)

          # Match the stock token as a substring, not the whole line:
          # some WLED 0.15.x snapshots keep an inline comment on this define.
          old_seg = "#define MAX_NUM_SEGMENTS  32"
          if old_seg not in s:
              raise SystemExit("MAX_NUM_SEGMENTS 32 token not found")
          s = s.replace(old_seg, "#define MAX_NUM_SEGMENTS  40", 1)

          # Keep WLED's original proportional formula. With 40 segments it
          # evaluates to 51200 bytes maximum effect data.
          data_formula = "#define MAX_SEGMENT_DATA  (MAX_NUM_SEGMENTS*1280)"
          if data_formula not in s:
              raise SystemExit("Original MAX_SEGMENT_DATA formula not found")

          write(p, s)

          # 3) Config loader: only physical buses count against WLED_MAX_BUSSES.
          p = "wled00/cfg.cpp"
          s = read(p)

          old = "if (s >= WLED_MAX_BUSSES+WLED_MIN_VIRTUAL_BUSSES) break;"
          if old not in s:
              raise SystemExit("cfg.cpp old total bus limit not found")
          s = s.replace(old, "if (s >= WLED_MAX_BUSSES) break;", 1)

          old_block = (
              "      doInitBusses = true;  // finalization done in beginStrip()\n"
              "      s++;\n"
              "    }\n"
              "  }\n"
              '  if (hw_led["rev"]) BusManager::getBus(0)->setReversed(true);'
          )
          new_block = (
              "      doInitBusses = true;  // finalization done in beginStrip()\n"
              "      if (!Bus::isVirtual(ledType)) s++; // only physical buses count against WLED_MAX_BUSSES\n"
              "    }\n"
              "  }\n"
              '  if (hw_led["rev"] && BusManager::getNumBusses()) BusManager::getBus(0)->setReversed(true);'
          )

          if old_block not in s:
              raise SystemExit("cfg.cpp bus increment block not found")
          s = s.replace(old_block, new_block, 1)
          write(p, s)

          # 4) LED settings POST parser.
          # IDs 0..9, A..Z, then a..d for buses 36..39.
          p = "wled00/set.cpp"
          s = read(p)

          loop_old = "for (int s = 0; s < WLED_MAX_BUSSES+WLED_MIN_VIRTUAL_BUSSES; s++) {"
          loop_pos = s.find(loop_old)
          if loop_pos < 0:
              raise SystemExit("set.cpp LED bus loop not found")

          block_end = s.find("    //doInitBusses = busesChanged;", loop_pos)
          if block_end < 0:
              raise SystemExit("set.cpp LED bus loop end not found")

          block = s[loop_pos:block_end]
          block = block.replace(
              loop_old,
              "for (int s = 0; s < 40; s++) {\n"
              "      const char busId = (s < 10) ? char('0' + s) : ((s < 36) ? char('A' + s - 10) : char('a' + s - 36));",
              1
          )

          block, n = re.subn(
              r"(?m)^\s*int offset = s < 10 \? (?:48|'0') : (?:55|'A' - 10);\s*\n",
              '',
              block,
              count=1
          )
          if n != 1:
              raise SystemExit("set.cpp old bus ID offset line not found")

          block = block.replace("offset+s", "busId")
          s = s[:loop_pos] + block + s[block_end:]
          write(p, s)

          # 5) LED settings JS generated by firmware: same ID mapping.
          p = "wled00/xml.cpp"
          s = read(p)

          loop_marker = "for (int s = 0; s < BusManager::getNumBusses(); s++) {"
          loop_pos = s.find(loop_marker)
          if loop_pos < 0:
              raise SystemExit("xml.cpp LED bus loop not found")

          block_end = s.find("    const ColorOrderMap& com =", loop_pos)
          if block_end < 0:
              raise SystemExit("xml.cpp LED bus loop end not found")

          block = s[loop_pos:block_end]
          block = block.replace(
              loop_marker,
              "for (int s = 0; s < BusManager::getNumBusses(); s++) {\n"
              "      const char busId = (s < 10) ? char('0' + s) : ((s < 36) ? char('A' + s - 10) : char('a' + s - 36));",
              1
          )

          block, n = re.subn(
              r"(?m)^\s*int offset = s < 10 \? (?:48|'0') : (?:55|'A' - 10);\s*\n",
              '',
              block,
              count=1
          )
          if n != 1:
              raise SystemExit("xml.cpp old bus ID offset line not found")

          block = block.replace("offset+s", "busId")
          s = s[:loop_pos] + block + s[block_end:]
          write(p, s)

          # 6) Browser LED settings page: same 40-output ID mapping.
          p = "wled00/data/settings_leds.htm"
          s = read(p)

          s, n = re.subn(
              r'function\s+chrID\(x\)\s*\{\s*return\s+String\.fromCharCode\(\(x<10\?48:55\)\+x\);\s*\}',
              (
                  "function chrID(x)  {\n"
                  "            if (x < 10) return String.fromCharCode(48+x);\n"
                  "            if (x < 36) return String.fromCharCode(55+x);\n"
                  "            return String.fromCharCode(61+x);\n"
                  "        }"
              ),
              s,
              count=1
          )
          if n != 1:
              raise SystemExit("settings_leds.htm chrID() not found")

          s = s.replace(
              "for (var i=0; i<10; i++) addLEDs(-1);",
              "for (var i=0; i<40; i++) addLEDs(-1);",
              1
          )

          write(p, s)

          # 7) Auto-segment safety: never write past MAX_NUM_SEGMENTS arrays.
          p = "wled00/FX_fcn.cpp"
          s = read(p)

          func_pos = s.find("void WS2812FX::makeAutoSegments(bool forceReset)")
          if func_pos < 0:
              raise SystemExit("makeAutoSegments() not found")

          loop = "for (size_t i = s; i < BusManager::getNumBusses(); i++) {"
          loop_pos = s.find(loop, func_pos)
          if loop_pos < 0:
              raise SystemExit("makeAutoSegments bus loop not found")

          replacement = loop + "\n      if (s >= MAX_NUM_SEGMENTS) break;"
          s = s[:loop_pos] + s[loop_pos:].replace(loop, replacement, 1)
          write(p, s)

          # 8) WT32-ETH01 default Ethernet board type.
          p = "platformio.ini"
          s = read(p)

          env_start = s.find("[env:esp32_eth]")
          if env_start < 0:
              raise SystemExit("[env:esp32_eth] not found")

          env_end = s.find("\n[", env_start + 1)
          if env_end < 0:
              env_end = len(s)

          section = s[env_start:env_end]

          if "-D WLED_ETH_DEFAULT=1" not in section:
              flag = "-D WLED_USE_ETHERNET"
              if flag not in section:
                  raise SystemExit("WLED_USE_ETHERNET flag not found in esp32_eth")
              section = section.replace(flag, flag + " -D WLED_ETH_DEFAULT=1", 1)

          s = s[:env_start] + section + s[env_end:]
          write(p, s)

          # 9) Custom About-screen label.
          # Keep the real firmware VERSION/VID unchanged, but customize the
          # JSON info fields used by the main WLED About overlay.
          # The UI formats them as: v + ver + " " + quoted cn
          # giving exactly: v.0.15.4 test ddp "Tech1977"
          p = "wled00/json.cpp"
          s = read(p)

          old_ver = 'root[F("ver")] = versionString;'
          old_cn  = 'root[F("cn")] = F(WLED_CODENAME);'

          if old_ver not in s:
              raise SystemExit("json.cpp info.ver assignment not found")
          if old_cn not in s:
              raise SystemExit("json.cpp info.cn assignment not found")

          s = s.replace(
              old_ver,
              'root[F("ver")] = F(".0.15.4 test ddp r1");',
              1
          )
          s = s.replace(
              old_cn,
              'root[F("cn")] = F("Tech1977");',
              1
          )

          write(p, s)

          print("PATCH OK")
          print(' - About label: v.0.15.4 test ddp "Tech1977"')
          print(" - 40 LED output form slots")
          print(" - output IDs 36..39 = a,b,c,d")
          print(" - virtual DDP buses do not count against physical bus limit")
          print(" - 40 segments")
          print(" - MAX_SEGMENT_DATA = 51200 bytes max")
          print(" - WT32-ETH01 Ethernet default")
          PY

      - name: Verify patch
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Classic ESP32 virtual slots ==="
          grep -n -A5 -B2 "WLED_MAX_BUSSES 19" wled00/const.h

          echo "=== Segment limits ==="
          grep -n -E "MAX_NUM_SEGMENTS|MAX_SEGMENT_DATA" wled00/FX.h | head -n 10
          grep -Fq '#define MAX_NUM_SEGMENTS  40' wled00/FX.h
          grep -Fq '#define MAX_SEGMENT_DATA  (MAX_NUM_SEGMENTS*1280)' wled00/FX.h

          echo "=== Config virtual-bus loader ==="
          grep -n -A45 "JsonArray ins = hw_led" wled00/cfg.cpp | head -n 60
          grep -q 'if (!Bus::isVirtual(ledType)) s++;' wled00/cfg.cpp

          echo "=== 40-output POST parser ==="
          grep -n -A4 "for (int s = 0; s < 40; s++)" wled00/set.cpp
          grep -q "char('a' + s - 36)" wled00/set.cpp

          echo "=== LED settings output ID map ==="
          grep -n -A6 "function chrID" wled00/data/settings_leds.htm
          grep -q "String.fromCharCode(61+x)" wled00/data/settings_leds.htm
          grep -q "char('a' + s - 36)" wled00/xml.cpp

          echo "=== Custom About label ==="
          grep -Fq 'root[F("ver")] = F(".0.15.4 test ddp");' wled00/json.cpp
          grep -Fq 'root[F("cn")] = F("Tech1977");' wled00/json.cpp

          echo "=== Ethernet ==="
          sed -n '/\[env:esp32_eth\]/,/^\[/p' platformio.ini | head -n 30
          sed -n '/\[env:esp32_eth\]/,/^\[/p' platformio.ini | grep -q -- "-D WLED_ETH_DEFAULT=1"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Install web UI dependencies
        run: npm ci

      - name: Build esp32_eth
        run: pio run -e esp32_eth

      - name: Prepare firmware
        shell: bash
        run: |
          set -euxo pipefail
          test -f .pio/build/esp32_eth/firmware.bin

          mkdir -p dist
          cp .pio/build/esp32_eth/firmware.bin \
            dist/WLED_v0.15.4_test_DDP_Tech1977.bin

          sha256sum \
            dist/WLED_v0.15.4_test_DDP_Tech1977.bin \
            > dist/WLED_v0.15.4_test_DDP_Tech1977.bin.sha256

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: WLED_v0.15.4_test_DDP_Tech1977
          path: dist/*
          if-no-files-found: error
