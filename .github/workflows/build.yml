name: Build WLED 0.15.4 ESP32-ETH01 40 DDP 40 Segments

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout WLED 0.15.4
        uses: actions/checkout@v6
        with:
          repository: wled/WLED
          ref: v0.15.4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Patch 40 DDP buses, 40 segments and WT32-ETH01
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Classic ESP32: 19 physical slots + 21 virtual slots = 40 total
          p = Path("wled00/const.h")
          s = p.read_text(encoding="utf-8")

          marker = "#define WLED_MAX_BUSSES 19"
          start = s.find(marker)
          if start < 0:
              raise SystemExit("Classic ESP32 WLED_MAX_BUSSES 19 block not found")

          target = "#define WLED_MIN_VIRTUAL_BUSSES 6"
          pos = s.find(target, start)
          if pos < 0 or (pos - start) > 800:
              raise SystemExit("Classic ESP32 WLED_MIN_VIRTUAL_BUSSES 6 not found")

          replacement = "#define WLED_MIN_VIRTUAL_BUSSES 21"
          s = s[:pos] + replacement + s[pos + len(target):]
          p.write_text(s, encoding="utf-8")

          # 2) Raise segment limit from 32 to 40.
          # Keep total segment effect data around original ~40 KiB.
          p = Path("wled00/FX.h")
          s = p.read_text(encoding="utf-8")

          old_seg = "#define MAX_NUM_SEGMENTS  32"
          new_seg = "#define MAX_NUM_SEGMENTS  40"
          if old_seg not in s:
              raise SystemExit("MAX_NUM_SEGMENTS 32 not found")
          s = s.replace(old_seg, new_seg, 1)

          old_data = "#define MAX_SEGMENT_DATA  (MAX_NUM_SEGMENTS*1280)"
          new_data = "#define MAX_SEGMENT_DATA  (40*1024)"
          if old_data not in s:
              raise SystemExit("MAX_SEGMENT_DATA expression not found")
          s = s.replace(old_data, new_data, 1)
          p.write_text(s, encoding="utf-8")

          # 3) WT32-ETH01 default Ethernet profile (type 1)
          p = Path("platformio.ini")
          s = p.read_text(encoding="utf-8")

          env_start = s.find("[env:esp32_eth]")
          if env_start < 0:
              raise SystemExit("[env:esp32_eth] not found")

          env_end = s.find("\n[", env_start + 1)
          if env_end < 0:
              env_end = len(s)

          section = s[env_start:env_end]
          flag = "-D WLED_USE_ETHERNET"
          if flag not in section:
              raise SystemExit("WLED_USE_ETHERNET flag not found in esp32_eth")

          if "-D WLED_ETH_DEFAULT=1" not in section:
              section = section.replace(flag, flag + " -D WLED_ETH_DEFAULT=1", 1)

          s = s[:env_start] + section + s[env_end:]
          p.write_text(s, encoding="utf-8")

          print("OK: WLED_MIN_VIRTUAL_BUSSES = 21")
          print("OK: MAX_NUM_SEGMENTS = 40")
          print("OK: MAX_SEGMENT_DATA = 40960 bytes")
          print("OK: WT32-ETH01 default Ethernet type = 1")
          PY

      - name: Verify patch
        shell: bash
        run: |
          echo "=== Classic ESP32 bus limits ==="
          grep -n -A4 -B2 "WLED_MAX_BUSSES 19" wled00/const.h

          echo "=== Segment limits ==="
          grep -n -A3 -B3 "MAX_NUM_SEGMENTS  40" wled00/FX.h
          grep -n "MAX_SEGMENT_DATA  (40\*1024)" wled00/FX.h

          echo "=== esp32_eth ==="
          sed -n '/\[env:esp32_eth\]/,/^\[/p' platformio.ini | head -n 25

          grep -q "#define WLED_MIN_VIRTUAL_BUSSES 21" wled00/const.h
          grep -q "#define MAX_NUM_SEGMENTS  40" wled00/FX.h
          grep -q "#define MAX_SEGMENT_DATA  (40\*1024)" wled00/FX.h
          sed -n '/\[env:esp32_eth\]/,/^\[/p' platformio.ini | grep -q -- "-D WLED_ETH_DEFAULT=1"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Install web UI dependencies
        run: npm ci

      - name: Build esp32_eth
        run: pio run -e esp32_eth

      - name: Prepare firmware
        shell: bash
        run: |
          test -f .pio/build/esp32_eth/firmware.bin
          mkdir -p dist
          cp .pio/build/esp32_eth/firmware.bin dist/WLED_0.15.4_ESP32-ETH01_40DDP_40SEG.bin
          sha256sum dist/WLED_0.15.4_ESP32-ETH01_40DDP_40SEG.bin > dist/WLED_0.15.4_ESP32-ETH01_40DDP_40SEG.bin.sha256

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: WLED_0.15.4_ESP32-ETH01_40DDP_40SEG
          path: dist/*
          if-no-files-found: error
