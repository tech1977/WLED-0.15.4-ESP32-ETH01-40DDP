name: Build WLED 0.15.4 ETH01 - PR4529 - 40 DDP - 40 Segments

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout WLED 0.15.4
        uses: actions/checkout@v6
        with:
          repository: wled/WLED
          ref: v0.15.4
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Backport official WLED PR 4529 - Unlimited buses
        shell: bash
        run: |
          set -euxo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          curl -fL --retry 3 \
            https://github.com/wled/WLED/pull/4529.patch \
            -o /tmp/wled-pr4529.patch

          test -s /tmp/wled-pr4529.patch

          echo "=== PR 4529 patch summary ==="
          grep '^Subject:' /tmp/wled-pr4529.patch || true

          # Apply the exact official PR commits onto the v0.15.4 tree.
          # -3 enables a three-way fallback when surrounding lines changed.
          git am -3 /tmp/wled-pr4529.patch

          echo "=== Backport applied ==="
          git --no-pager log --oneline -8

      - name: Patch 40 segments and WT32-ETH01 default
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # ------------------------------------------------------------
          # 1) 40 segments.
          # Keep the original WLED per-segment effect-data ratio:
          # 40 * 1280 = 51200 bytes maximum effect data.
          # ------------------------------------------------------------
          p = Path("wled00/FX.h")
          s = p.read_text(encoding="utf-8")

          s2, n = re.subn(
              r'(?m)^#define\s+MAX_NUM_SEGMENTS\s+32\s*$',
              '#define MAX_NUM_SEGMENTS  40',
              s,
              count=1
          )
          if n != 1:
              raise SystemExit("MAX_NUM_SEGMENTS 32 not found exactly once")
          s = s2

          # If the original formula is still present, leave it as a formula.
          # With MAX_NUM_SEGMENTS=40 this becomes 51200 bytes automatically.
          if not re.search(r'(?m)^#define\s+MAX_SEGMENT_DATA\s+\(MAX_NUM_SEGMENTS\*1280\)\s*$', s):
              # Accept an already-customised 40 KiB line from an earlier workflow
              # and restore the original proportional formula.
              s2, n = re.subn(
                  r'(?m)^#define\s+MAX_SEGMENT_DATA\s+\(40\*1024\)\s*$',
                  '#define MAX_SEGMENT_DATA  (MAX_NUM_SEGMENTS*1280)',
                  s,
                  count=1
              )
              if n != 1:
                  raise SystemExit("MAX_SEGMENT_DATA formula not found")
              s = s2

          p.write_text(s, encoding="utf-8")

          # ------------------------------------------------------------
          # 2) WT32-ETH01 as the default Ethernet board.
          # WLED_ETH_WT32_ETH01 == 1 in WLED.
          # ------------------------------------------------------------
          p = Path("platformio.ini")
          s = p.read_text(encoding="utf-8")

          env_start = s.find("[env:esp32_eth]")
          if env_start < 0:
              raise SystemExit("[env:esp32_eth] not found")

          env_end = s.find("\n[", env_start + 1)
          if env_end < 0:
              env_end = len(s)

          section = s[env_start:env_end]

          if "-D WLED_ETH_DEFAULT=1" not in section:
              flag = "-D WLED_USE_ETHERNET"
              if flag not in section:
                  raise SystemExit("WLED_USE_ETHERNET flag not found in esp32_eth")
              section = section.replace(
                  flag,
                  flag + " -D WLED_ETH_DEFAULT=1",
                  1
              )

          s = s[:env_start] + section + s[env_end:]
          p.write_text(s, encoding="utf-8")

          print("OK: official PR 4529 backport is present")
          print("OK: MAX_NUM_SEGMENTS = 40")
          print("OK: MAX_SEGMENT_DATA = 40 * 1280 = 51200 bytes")
          print("OK: WT32-ETH01 default Ethernet type = 1")
          PY

      - name: Verify custom build
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Segment limits ==="
          grep -n -E "MAX_NUM_SEGMENTS|MAX_SEGMENT_DATA" wled00/FX.h | head -n 10
          grep -qE '^#define[[:space:]]+MAX_NUM_SEGMENTS[[:space:]]+40[[:space:]]*$' wled00/FX.h
          grep -qE '^#define[[:space:]]+MAX_SEGMENT_DATA[[:space:]]+\(MAX_NUM_SEGMENTS\*1280\)[[:space:]]*$' wled00/FX.h

          echo "=== Ethernet env ==="
          sed -n '/\[env:esp32_eth\]/,/^\[/p' platformio.ini | head -n 30
          sed -n '/\[env:esp32_eth\]/,/^\[/p' platformio.ini | grep -q -- "-D WLED_ETH_DEFAULT=1"

          echo "=== Files changed by backport/customisation ==="
          git status --short
          git diff --stat HEAD || true

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Install web UI dependencies
        run: npm ci

      - name: Build esp32_eth
        run: pio run -e esp32_eth

      - name: Prepare firmware
        shell: bash
        run: |
          set -euxo pipefail
          test -f .pio/build/esp32_eth/firmware.bin

          mkdir -p dist
          cp .pio/build/esp32_eth/firmware.bin \
            dist/WLED_0.15.4_ESP32-ETH01_PR4529_40DDP_40SEG.bin

          sha256sum \
            dist/WLED_0.15.4_ESP32-ETH01_PR4529_40DDP_40SEG.bin \
            > dist/WLED_0.15.4_ESP32-ETH01_PR4529_40DDP_40SEG.bin.sha256

          # Keep the exact PR patch in the artifact for traceability.
          cp /tmp/wled-pr4529.patch dist/WLED_PR4529_unlimited-buses.patch

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: WLED_0.15.4_ESP32-ETH01_PR4529_40DDP_40SEG
          path: dist/*
          if-no-files-found: error
